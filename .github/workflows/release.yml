name: Publish release

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type publish-1.0.1 after reviewing the release evidence
        required: true
        type: string
      dist_tag:
        description: >
          npm dist-tag to publish under. Each minor takes latest, so a plain `npm install` gets the
          newest supported product; rc is for release candidates, which are not that. `candidate` is
          the temporary tag the 1.0.0 promotion publishes under before latest is moved by hand, so
          the final tarballs can be checksum-verified on the registry without any default install
          resolving to them first; it is removed once latest moves. There is no `next`: a tag
          meaning "whatever is newest" either shadows latest or contradicts it, and it was retired
          after 0.7.0. `stable` is never set here — it moves by hand, by decision, and not by a
          release. See the npm Channel Policy in PLAN.md.
        required: true
        type: choice
        default: latest
        options:
          - latest
          - rc
          - candidate

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  publish:
    if: inputs.confirmation == 'publish-1.0.1' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.16.0
      # A release publishes only a commit whose CI has finished and passed. Dispatching while that
      # run is still going is an ordinary thing to do — the 0.6.1 release did it — and failing
      # immediately taught nothing except to wait and try again, so this waits instead. It is a
      # gate on the result, never a substitute for it: an unfinished run after the timeout, a
      # failure, or no run at all all stop the release.
      - name: Verify CI passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 30); do
            conclusion="$(gh run list --workflow CI --branch main --commit "$GITHUB_SHA" \
              --status completed --limit 1 --json conclusion --jq '.[0].conclusion')"
            if [ -n "${conclusion}" ]; then
              test "${conclusion}" = success
              exit $?
            fi
            echo "CI for ${GITHUB_SHA} has not finished yet; waiting (${attempt}/30)."
            sleep 20
          done
          echo "::error::CI for ${GITHUB_SHA} did not finish within ten minutes"
          exit 1
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm run pack:smoke
      - run: npm run release:check
      # Each package publishes only when its exact version is absent from the registry, so
      # a run that failed partway can be retried without tripping over what it already
      # published.
      #
      # Publishing is the only registry write this workflow performs, and `--tag` on the publish
      # itself is the only way it sets a tag. Trusted publishing authorizes the publish request;
      # a separate `npm dist-tag add` afterwards is not authenticated and answers E401, even for
      # the package just published and even in the same step. Two releases learned that: on 0.6.0
      # the call for the plugin failed, and on 0.6.1 the call for the CLI failed immediately after
      # `+ @snack-ai/cli@0.6.1`. The 0.6.0 CLI call only appeared to work because npm no-ops when
      # the tag already points at that version. Tags other than `latest` are moved by hand; see
      # docs/release/identity.md.
      - name: Publish CLI package
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          if npm view "@snack-ai/cli@${version}" version > /dev/null 2>&1; then
            echo "@snack-ai/cli@${version} is already published; skipping." >> "$GITHUB_STEP_SUMMARY"
            echo "CLI_PUBLISHED=0" >> "$GITHUB_ENV"
          else
            npm publish --workspace @snack-ai/cli --tag "${DIST_TAG}" --access public --provenance
            echo "Published @snack-ai/cli@${version} to ${DIST_TAG}." >> "$GITHUB_STEP_SUMMARY"
            echo "CLI_PUBLISHED=1" >> "$GITHUB_ENV"
          fi
      - name: Publish OpenCode plugin
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          version="$(node -p "require('./packages/opencode/package.json').version")"
          if npm view "@snack-ai/opencode@${version}" version > /dev/null 2>&1; then
            echo "@snack-ai/opencode@${version} is already published; skipping." >> "$GITHUB_STEP_SUMMARY"
            echo "PLUGIN_PUBLISHED=0" >> "$GITHUB_ENV"
          else
            npm publish --workspace @snack-ai/opencode --tag "${DIST_TAG}" --access public --provenance
            echo "Published @snack-ai/opencode@${version} to ${DIST_TAG}." >> "$GITHUB_STEP_SUMMARY"
            echo "PLUGIN_PUBLISHED=1" >> "$GITHUB_ENV"
          fi
      # A green run must mean both packages are on the registry at the version this commit
      # declares, and that the tag this run set points at it. Without this, a skipped or silently
      # ineffective publish still reports success.
      - name: Verify both packages are published
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          cli_version="$(node -p "require('./packages/cli/package.json').version")"
          plugin_version="$(node -p "require('./packages/opencode/package.json').version")"
          failed=0
          for spec in "@snack-ai/cli@${cli_version}" "@snack-ai/opencode@${plugin_version}"; do
            # A freshly published version takes a moment to become readable, so a single
            # immediate lookup reports a version that was in fact published.
            found=0
            for attempt in 1 2 3 4 5 6; do
              if npm view "${spec}" version > /dev/null 2>&1; then
                found=1
                break
              fi
              sleep 10
            done
            if [ "${found}" -eq 1 ]; then
              echo "verified ${spec}" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::${spec} is not on the registry after publishing"
              failed=1
            fi
          done
          # Only the tag this run set, and only for a package this run actually published. A
          # package that was skipped is carrying a previous release's tags, and reasserting them
          # here would be this run claiming something it did not do. `--tag` on the publish is the
          # only way this workflow sets a tag; every other tag is moved by hand.
          for package in "@snack-ai/cli:${cli_version}:${CLI_PUBLISHED}" \
                         "@snack-ai/opencode:${plugin_version}:${PLUGIN_PUBLISHED}"; do
            name="${package%%:*}"
            rest="${package#*:}"
            expected="${rest%:*}"
            published="${rest##*:}"
            if [ "${published}" != "1" ]; then
              echo "skipped ${name}: not published by this run" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            resolved="$(npm view "${name}" "dist-tags.${DIST_TAG}" 2>/dev/null || true)"
            if [ "${resolved}" = "${expected}" ]; then
              echo "verified ${name}@${DIST_TAG} is ${expected}" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::${name}@${DIST_TAG} resolves to '${resolved}', not ${expected}"
              failed=1
            fi
          done
          exit "${failed}"
