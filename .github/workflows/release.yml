name: Publish release

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: >
          Type publish-<version>, the version in packages/cli/package.json, after reviewing the
          release evidence. Anything else fails the run.
        required: true
        type: string
      dist_tag:
        description: >
          npm dist-tag to publish under. Each minor takes latest, so a plain `npm install` gets the
          newest supported product; rc is for release candidates, which are not that. `candidate` is
          the temporary tag the 1.0.0 promotion publishes under before latest is moved by hand, so
          the final tarballs can be checksum-verified on the registry without any default install
          resolving to them first; it is removed once latest moves. There is no `next`: a tag
          meaning "whatever is newest" either shadows latest or contradicts it, and it was retired
          after 0.7.0. `stable` is never set here — it moves by hand, by decision, and not by a
          release. See the npm Channel Policy in PLAN.md.
        required: true
        type: choice
        default: latest
        options:
          - latest
          - rc
          - candidate

permissions:
  actions: read
  # write: the run tags the published commit and creates its GitHub release.
  contents: write
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.16.0
      # The confirmation used to be a literal in the `if:` above, edited by a PR before every
      # release, and a mismatch skipped the job and reported success. Reading the version here
      # removes that PR and turns a mistyped confirmation into a failure.
      - name: Check the confirmation names this version
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          if [ "${CONFIRMATION}" != "publish-${version}" ]; then
            echo "::error::confirmation '${CONFIRMATION}' does not name this version; type publish-${version}"
            exit 1
          fi
      # A release publishes only a commit whose CI has finished and passed. Dispatching while that
      # run is still going is an ordinary thing to do — the 0.6.1 release did it — and failing
      # immediately taught nothing except to wait and try again, so this waits instead. It is a
      # gate on the result, never a substitute for it: an unfinished run after the timeout, a
      # failure, or no run at all all stop the release.
      - name: Verify CI passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 30); do
            conclusion="$(gh run list --workflow CI --branch main --commit "$GITHUB_SHA" \
              --status completed --limit 1 --json conclusion --jq '.[0].conclusion')"
            if [ -n "${conclusion}" ]; then
              test "${conclusion}" = success
              exit $?
            fi
            echo "CI for ${GITHUB_SHA} has not finished yet; waiting (${attempt}/30)."
            sleep 20
          done
          echo "::error::CI for ${GITHUB_SHA} did not finish within ten minutes"
          exit 1
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm run pack:smoke
      - run: npm run release:check
      # Each package publishes only when its exact version is absent from the registry, so
      # a run that failed partway can be retried without tripping over what it already
      # published.
      #
      # Publishing is the only registry write this workflow performs, and `--tag` on the publish
      # itself is the only way it sets a tag. Trusted publishing authorizes the publish request;
      # a separate `npm dist-tag add` afterwards is not authenticated and answers E401, even for
      # the package just published and even in the same step. Two releases learned that: on 0.6.0
      # the call for the plugin failed, and on 0.6.1 the call for the CLI failed immediately after
      # `+ @snack-ai/cli@0.6.1`. The 0.6.0 CLI call only appeared to work because npm no-ops when
      # the tag already points at that version. Tags other than `latest` are moved by hand; see
      # docs/release/identity.md.
      - name: Publish CLI package
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          if npm view "@snack-ai/cli@${version}" version > /dev/null 2>&1; then
            echo "@snack-ai/cli@${version} is already published; skipping." >> "$GITHUB_STEP_SUMMARY"
            echo "CLI_PUBLISHED=0" >> "$GITHUB_ENV"
          else
            npm publish --workspace @snack-ai/cli --tag "${DIST_TAG}" --access public --provenance
            echo "Published @snack-ai/cli@${version} to ${DIST_TAG}." >> "$GITHUB_STEP_SUMMARY"
            echo "CLI_PUBLISHED=1" >> "$GITHUB_ENV"
          fi
      - name: Publish OpenCode plugin
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          version="$(node -p "require('./packages/opencode/package.json').version")"
          if npm view "@snack-ai/opencode@${version}" version > /dev/null 2>&1; then
            echo "@snack-ai/opencode@${version} is already published; skipping." >> "$GITHUB_STEP_SUMMARY"
            echo "PLUGIN_PUBLISHED=0" >> "$GITHUB_ENV"
          else
            npm publish --workspace @snack-ai/opencode --tag "${DIST_TAG}" --access public --provenance
            echo "Published @snack-ai/opencode@${version} to ${DIST_TAG}." >> "$GITHUB_STEP_SUMMARY"
            echo "PLUGIN_PUBLISHED=1" >> "$GITHUB_ENV"
          fi
      # A green run must mean both packages are on the registry at the version this commit
      # declares, and that the tag this run set points at it. Without this, a skipped or silently
      # ineffective publish still reports success.
      - name: Verify both packages are published
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          cli_version="$(node -p "require('./packages/cli/package.json').version")"
          plugin_version="$(node -p "require('./packages/opencode/package.json').version")"
          failed=0
          for spec in "@snack-ai/cli@${cli_version}" "@snack-ai/opencode@${plugin_version}"; do
            # A freshly published version takes a moment to become readable, so a single
            # immediate lookup reports a version that was in fact published.
            found=0
            # Five minutes. `1.2.1` published correctly and failed this check at one minute, while the
            # registry was still propagating.
            for attempt in $(seq 1 30); do
              if npm view "${spec}" version > /dev/null 2>&1; then
                found=1
                break
              fi
              sleep 10
            done
            if [ "${found}" -eq 1 ]; then
              echo "verified ${spec}" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::${spec} is not on the registry after publishing"
              failed=1
            fi
          done
          # Only the tag this run set, and only for a package this run actually published. A
          # package that was skipped is carrying a previous release's tags, and reasserting them
          # here would be this run claiming something it did not do. `--tag` on the publish is the
          # only way this workflow sets a tag; every other tag is moved by hand.
          for package in "@snack-ai/cli:${cli_version}:${CLI_PUBLISHED}" \
                         "@snack-ai/opencode:${plugin_version}:${PLUGIN_PUBLISHED}"; do
            name="${package%%:*}"
            rest="${package#*:}"
            expected="${rest%:*}"
            published="${rest##*:}"
            if [ "${published}" != "1" ]; then
              echo "skipped ${name}: not published by this run" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            resolved="$(npm view "${name}" "dist-tags.${DIST_TAG}" 2>/dev/null || true)"
            if [ "${resolved}" = "${expected}" ]; then
              echo "verified ${name}@${DIST_TAG} is ${expected}" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::${name}@${DIST_TAG} resolves to '${resolved}', not ${expected}"
              failed=1
            fi
          done
          exit "${failed}"
      # What a consumer downloads is the registry's tarball, so that is what is compared against the
      # digests the gates approved. This was a hand step after every release.
      #
      # The pack is retried, like the lookup in the step above. The 1.3.0 run published both
      # packages, saw both versions in the step above, and then failed here: `npm pack` of a version
      # the registry had only just started serving errored under `bash -e`, before a single digest
      # was compared. That was propagation, not a mismatch, and it is reported as such -- the only
      # failure here that means the tarballs are wrong is the `does not record` line below.
      - name: Verify the registry serves the tarballs the evidence records
        run: |
          cli_version="$(node -p "require('./packages/cli/package.json').version")"
          plugin_version="$(node -p "require('./packages/opencode/package.json').version")"
          packed=0
          for attempt in $(seq 1 30); do
            rm -rf "${RUNNER_TEMP}/registry"
            mkdir -p "${RUNNER_TEMP}/registry"
            if npm pack "@snack-ai/cli@${cli_version}" "@snack-ai/opencode@${plugin_version}" \
              --pack-destination "${RUNNER_TEMP}/registry" --silent > /dev/null; then
              packed=1
              break
            fi
            echo "The registry does not serve both tarballs yet; waiting (${attempt}/30)."
            sleep 10
          done
          if [ "${packed}" -ne 1 ]; then
            echo "::error::registry propagation: npm pack of @snack-ai/cli@${cli_version} and @snack-ai/opencode@${plugin_version} still fails after five minutes; no digest was compared. Rerun this workflow; it publishes nothing twice."
            exit 1
          fi
          failed=0
          for tarball in "${RUNNER_TEMP}"/registry/*.tgz; do
            digest="sha256:$(sha256sum "${tarball}" | cut -d' ' -f1)"
            if grep -qF "${digest}" docs/release/artifacts.md; then
              echo "registry $(basename "${tarball}") matches ${digest}" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::registry $(basename "${tarball}") is ${digest}, which artifacts.md does not record"
              failed=1
            fi
          done
          exit "${failed}"
      # The tag and the GitHub release are the record of the publication. Both were written by hand
      # after every publish and then recorded again in docs/release/identity.md by a PR of their own.
      #
      # It runs whenever that record is missing, not only when this run published. Gating it on
      # `CLI_PUBLISHED == '1'` meant a run that failed after publishing -- 1.3.0 failed in the step
      # above -- could never be completed: its retry skips both publishes, so it skipped this step
      # too and the version stayed on npm with no tag and no release. Every step above is still a
      # precondition (the confirmation, CI, the gate, both packages readable, the registry digests),
      # and when this run did not publish, the registry must name this commit as the one it was
      # published from, so a release is never created for a version this commit did not cut, and
      # the channel tag must name this version, so a release is never marked for a channel that
      # serves another one.
      - name: Tag the published commit and create its GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          plugin_version="$(node -p "require('./packages/opencode/package.json').version")"
          if gh release view "v${version}" > /dev/null 2>&1; then
            echo "The GitHub release v${version} already exists; nothing to record." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "${CLI_PUBLISHED}" != "1" ]; then
            published_from="$(npm view "@snack-ai/cli@${version}" gitHead 2>/dev/null || true)"
            if [ "${published_from}" != "${GITHUB_SHA}" ]; then
              echo "::error::@snack-ai/cli@${version} was published from '${published_from}', not ${GITHUB_SHA}; this run will not create its release"
              exit 1
            fi
            # The verify step checks the channel tag only for a package this run published, so a
            # retry would otherwise mark the release Latest, under "npm ${DIST_TAG}", with nothing
            # having checked that the channel names this version.
            channel="$(npm view @snack-ai/cli "dist-tags.${DIST_TAG}" 2>/dev/null || true)"
            if [ "${channel}" != "${version}" ]; then
              echo "::error::@snack-ai/cli@${DIST_TAG} resolves to '${channel}', not ${version}; this run will not create its release"
              exit 1
            fi
            echo "Recording v${version}, published from ${GITHUB_SHA} by an earlier run." >> "$GITHUB_STEP_SUMMARY"
          fi
          notes="${RUNNER_TEMP}/notes.md"
          node scripts/release-notes.mjs "${version}" "${plugin_version}" > "${notes}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo
            echo "## Published"
            echo
            echo "From ${GITHUB_SHA} by ${run_url}, npm ${DIST_TAG}, with SLSA provenance."
            echo "The registry tarballs match docs/release/artifacts.md."
          } >> "${notes}"
          flags=(--latest)
          if [ "${DIST_TAG}" != "latest" ]; then flags=(--prerelease --latest=false); fi
          gh release create "v${version}" --target "${GITHUB_SHA}" --title "v${version}" \
            --notes-file "${notes}" "${flags[@]}"
