name: Publish technical preview

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type publish-0.1.0 after reviewing the release evidence
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  publish:
    if: inputs.confirmation == 'publish-0.1.0' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.16.0
      - name: Verify CI passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run:
          test "$(gh run list --workflow CI --branch main --commit "$GITHUB_SHA" --status completed
          --limit 1 --json conclusion --jq '.[0].conclusion')" = success
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm run pack:smoke
      - run: npm run release:check
        env:
          SNACK_NPM_BOOTSTRAP: "1"
      - name: Publish package
        run: npm publish --workspace @snack-ai/cli --tag next --access public --provenance
        env:
          # Used only to bootstrap the package before npm can accept its trusted-publisher binding.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
