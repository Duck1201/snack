name: Publish release

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type publish-0.6.0 after reviewing the release evidence
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  publish:
    if: inputs.confirmation == 'publish-0.6.0' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.16.0
      - name: Verify CI passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run:
          test "$(gh run list --workflow CI --branch main --commit "$GITHUB_SHA" --status completed
          --limit 1 --json conclusion --jq '.[0].conclusion')" = success
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm run pack:smoke
      - run: npm run release:check
      # Each package publishes only when its exact version is absent from the registry, so
      # a run that failed partway can be retried without tripping over what it already
      # published.
      - name: Publish CLI package
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          if npm view "@snack-ai/cli@${version}" version > /dev/null 2>&1; then
            echo "@snack-ai/cli@${version} is already published; skipping." >> "$GITHUB_STEP_SUMMARY"
          else
            npm publish --workspace @snack-ai/cli --tag latest --access public --provenance
            echo "Published @snack-ai/cli@${version}." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish OpenCode plugin
        run: |
          version="$(node -p "require('./packages/opencode/package.json').version")"
          if npm view "@snack-ai/opencode@${version}" version > /dev/null 2>&1; then
            echo "@snack-ai/opencode@${version} is already published; skipping." >> "$GITHUB_STEP_SUMMARY"
          else
            npm publish --workspace @snack-ai/opencode --tag latest --access public --provenance
            echo "Published @snack-ai/opencode@${version}." >> "$GITHUB_STEP_SUMMARY"
          fi
      # A version already on the registry still has to carry the tag this release promotes. The
      # plugin published to `next` before the MVP, so moving `latest` onto the MVP-compatible
      # version is the only thing left for it; a release that skipped this would leave new users
      # installing a pre-MVP plugin by default. Publishing with `--tag latest` above makes this a
      # no-op for anything published in this run.
      - name: Promote both packages to the latest tag
        run: |
          cli_version="$(node -p "require('./packages/cli/package.json').version")"
          plugin_version="$(node -p "require('./packages/opencode/package.json').version")"
          npm dist-tag add "@snack-ai/cli@${cli_version}" latest
          npm dist-tag add "@snack-ai/opencode@${plugin_version}" latest
          # `next` is where pre-release work lands, so it must never resolve to something older
          # than `latest`: `@next` would otherwise hand an early adopter a build the MVP fixed.
          npm dist-tag add "@snack-ai/cli@${cli_version}" next
          npm dist-tag add "@snack-ai/opencode@${plugin_version}" next
      # A green run must mean both packages are on the registry, at the version this commit
      # declares, under the tag a default install resolves. Without this, a skipped
      # or silently ineffective publish still reports success.
      - name: Verify both packages are published
        run: |
          cli_version="$(node -p "require('./packages/cli/package.json').version")"
          plugin_version="$(node -p "require('./packages/opencode/package.json').version")"
          failed=0
          for spec in "@snack-ai/cli@${cli_version}" "@snack-ai/opencode@${plugin_version}"; do
            # A freshly published version takes a moment to become readable, so a single
            # immediate lookup reports a version that was in fact published.
            found=0
            for attempt in 1 2 3 4 5 6; do
              if npm view "${spec}" version > /dev/null 2>&1; then
                found=1
                break
              fi
              sleep 10
            done
            if [ "${found}" -eq 1 ]; then
              echo "verified ${spec}" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::${spec} is not on the registry after publishing"
              failed=1
            fi
          done
          for package in "@snack-ai/cli:${cli_version}" "@snack-ai/opencode:${plugin_version}"; do
            name="${package%:*}"
            expected="${package##*:}"
            resolved="$(npm view "${name}" dist-tags.latest 2>/dev/null || true)"
            if [ "${resolved}" = "${expected}" ]; then
              echo "verified ${name}@latest is ${expected}" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::${name}@latest resolves to '${resolved}', not ${expected}"
              failed=1
            fi
          done
          exit "${failed}"
